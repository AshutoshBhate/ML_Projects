# .github/workflows/ci.yml (Final Version with Deploy Step)

name: Test Build Push and Deploy API

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock Pillow psycopg2-binary
          pip install -r ./Potato_Disease_Classification/api/requirements.txt
      
      - name: Run Pytest
        run: pytest ./Potato_Disease_Classification/tests/
        env:
          PYTHONPATH: ./Potato_Disease_Classification
          DATABASE_HOSTNAME: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          TF_SERVING_URL: "http://mock-server:8501"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Potato_Disease_Classification/api
          file: ./Potato_Disease_Classification/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/potato-classifier-api:latest
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},mode=max

  deploy:
    runs-on: ubuntu-latest
    # This job will only run if the 'build' job has completed successfully
    needs: [build]
    # We also only want to deploy on a push to the master branch, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploying to server
        run: echo "Deploying the image ${{ secrets.DOCKER_HUB_USERNAME }}/potato-classifier-api:latest to the production server..."
      - name: Placeholder for real deployment commands
        run: echo "Future commands would go here, e.g., ssh into a server, run docker-compose pull, and docker-compose up."